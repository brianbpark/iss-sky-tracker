name: ISSSkyTracker
options:
  bundleIdPrefix: com.brianbpark
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  ISSSkyTracker:
    type: application
    platform: iOS
    sources:
      - path: ISSSkyTracker
    info:
      path: ISSSkyTracker/Info.plist
      properties:
        CFBundleDisplayName: ISS Sky
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        NSCameraUsageDescription: "The camera shows the sky behind the ISS trajectory overlay."
        NSLocationWhenInUseUsageDescription: "Your location is used to calculate when and where the ISS will cross your sky."
        NSMotionUsageDescription: "Motion and compass data tell the app where your phone is pointing in the sky."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brianbpark.ISSSkyTracker
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
  ISSSkyTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ISSSkyTrackerTests
    dependencies:
      - target: ISSSkyTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brianbpark.ISSSkyTrackerTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ISSSkyTracker:
    build:
      targets:
        ISSSkyTracker: all
        ISSSkyTrackerTests: [test]
    test:
      targets:
        - ISSSkyTrackerTests
